<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rounded source subset</title><style>
html {font-family:AetherB0;font-size:16px;font-weight:400;line-height:24px;color:#183047;white-space:nowrap}
body {background-color:#dce8f4;padding-top:24px;padding-right:20px;padding-bottom:24px;padding-left:20px}
.card {background-color:#ffffff;border-radius:24px;border-width:2px;border-style:solid;border-color:#95b0c9;padding-top:20px;padding-right:20px;padding-bottom:20px;padding-left:20px}
h1 {white-space:normal;font-size:24px;line-height:32px;font-weight:700;color:#244466;}
p {white-space:normal;}
label {font-weight:700;}
.field {border-radius:12px;border-width:2px;border-style:solid;border-color:#7896b2;background-color:#edf4fa;padding-top:8px;padding-right:10px;padding-bottom:8px;padding-left:10px;}
.action {padding-left:12px;padding-right:12px;border-radius:16px;background-color:#244466;color:#ffffff;font-weight:700;padding-top:10px;padding-bottom:10px;}
.note {font-size:12px;line-height:20px;color:#49637a;}
</style></head><body><main class="card"><h1>Tu espacio nativo</h1><p>Tarjeta con esquinas redondeadas, texto con acentos y controles auténticos.</p><label for="name">Nombre</label><input id="name" class="field" type="text" placeholder="Escribe tu nombre completo para continuar"><label for="key">Clave de ejemplo</label><input id="key" class="field" type="password" value="Demo1234"><button class="action" type="button">Continuar</button><p class="note">Ejemplo estático del subconjunto source. Sin interacción ni autenticación.</p></main></body></html>
