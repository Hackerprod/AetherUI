<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>B3 dos paneles</title><style>
html{font-family:AetherB0;font-size:16px;font-weight:400;line-height:24px;color:#f5f6fa;white-space:normal}
body{margin:0px;background-color:#10131d}
.page{width:1280px;height:800px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.shell{width:1120px;height:680px;display:flex;flex-direction:row;align-items:stretch;gap:0px;box-sizing:border-box;border:1px solid #34394b}
.story{width:52%;min-width:0px;padding:48px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;background-color:#29354f}
.panel{width:48%;min-width:0px;padding:54px 52px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:stretch;background-color:#191d29}
h1{font-size:40px;line-height:48px;font-weight:700}h2{font-size:28px;line-height:36px;font-weight:700}
.brand{font-size:24px;line-height:32px;font-weight:700}.footer{font-size:12px;line-height:20px}
.stat-row{display:flex;flex-direction:row;align-items:start;gap:20px}.stat{width:180px;min-width:0px}
label{font-size:13px;line-height:20px;font-weight:700;margin-top:12px}
input{width:auto;height:40px;box-sizing:border-box;border:1px solid #454b60;padding:4px 8px;background-color:#222737;color:#f5f6fa}
button{height:40px;box-sizing:border-box;margin-top:16px;background-color:#b8a3ff;color:#201739;font-weight:700}
</style></head><body><main class="page"><section class="shell">
<aside class="story"><div class="brand">NEXO B3</div><div><h1>Grandes ideas.<br>Un nuevo comienzo.</h1><p>Conecta tus <strong>proyectos</strong>, encuentra tu ritmo y construye <span>lo que viene después.</span></p><div class="stat-row"><div class="stat"><p>Sin límites</p></div><div class="stat"><p>Un espacio para crear</p></div></div></div><p class="footer">Demostración nativa de layout y texto.</p></aside>
<section class="panel"><h2>Qué bueno verte.</h2><p>Inicia sesión para continuar.</p><form><label for="user">Usuario</label><input id="user" type="text" placeholder="Usuario"><label for="pass">Clave</label><input id="pass" type="password" value="Demo"><button type="button">Entrar</button></form></section>
</section></main></body></html>
