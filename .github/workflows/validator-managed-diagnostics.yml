name: Validator managed diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validator-managed-diagnostics.yml'
      - 'native/**'
      - 'global.json'
      - 'bindings/dotnet/Directory.*.props'
      - 'bindings/dotnet/src/**'
      - 'bindings/dotnet/tools/AetherUI.Validator/**'
      - 'bindings/dotnet/tests/AetherUI.Metrics.*/**'

permissions:
  contents: read

concurrency:
  group: validator-managed-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-validation:
    name: Focal host phase build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        # Keep global.json's latestFeature resolution away from preinstalled SDKs.
        # setup-dotnet puts this host on PATH and exports DOTNET_ROOT for later steps.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/aetherui-dotnet-10.0.302
        with:
          dotnet-version: '10.0.302'
      # Headless C/T after independently accepted P. Does not execute Validator or a drawing backend,
      # a browser, native tests or the general managed test runner.
      - name: Build the candidate and run focal headless phase tests
        run: ./bindings/dotnet/tests/AetherUI.Metrics.Preflight/Prepare.ps1
      - name: Retain public focal evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validator-managed-phases-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/validator-metrics/evidence/manifest.json
            artifacts/validator-metrics/evidence/dependencies.json
            artifacts/validator-metrics/evidence/preflight.json
            artifacts/validator-metrics/evidence/stage-source.json
            artifacts/validator-metrics/evidence/stage-toolchain.json
            artifacts/validator-metrics/evidence/stage-native-configure.json
            artifacts/validator-metrics/evidence/stage-native-build.json
            artifacts/validator-metrics/evidence/stage-native-install.json
            artifacts/validator-metrics/evidence/stage-native-verify.json
            artifacts/validator-metrics/evidence/stage-core-restore.json
            artifacts/validator-metrics/evidence/stage-core-build.json
            artifacts/validator-metrics/evidence/stage-validator-restore.json
            artifacts/validator-metrics/evidence/stage-validator-build.json
            artifacts/validator-metrics/evidence/stage-preflight-restore.json
            artifacts/validator-metrics/evidence/stage-preflight-build.json
            artifacts/validator-metrics/evidence/stage-preflight-run.json
            artifacts/validator-metrics/evidence/tests.json
            artifacts/validator-metrics/evidence/export-baseline.json
            artifacts/validator-metrics/evidence/export-candidate.json
            artifacts/validator-metrics/evidence/comparison.json
            artifacts/validator-metrics/evidence/stage-tests-restore.json
            artifacts/validator-metrics/evidence/stage-tests-build.json
            artifacts/validator-metrics/evidence/stage-tests-run.json
            artifacts/validator-metrics/evidence/stage-export-source.json
            artifacts/validator-metrics/evidence/stage-export-baseline-restore.json
            artifacts/validator-metrics/evidence/stage-export-baseline-build.json
            artifacts/validator-metrics/evidence/stage-export-candidate-restore.json
            artifacts/validator-metrics/evidence/stage-export-candidate-build.json
            artifacts/validator-metrics/evidence/stage-export-baseline-run.json
            artifacts/validator-metrics/evidence/stage-export-candidate-run.json
            artifacts/validator-metrics/evidence/stage-export-compare.json
