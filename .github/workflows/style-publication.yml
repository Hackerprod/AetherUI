name: Managed style publication contracts
on:
  push:
    branches-ignore:
      - 'backup/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Build and install default-off native runtime
        run: |
          cmake -S native -B artifacts/build/publication -DCMAKE_BUILD_TYPE=Release -DAETHERUI_BUILD_TESTS=OFF -DAETHERUI_ENABLE_STATE_INCREMENTAL=OFF -DCMAKE_INSTALL_PREFIX="$PWD/artifacts/native/linux-x64"
          cmake --build artifacts/build/publication --target aether_core --parallel 2
          cmake --install artifacts/build/publication
      - name: Run publication and input trace contracts
        run: bindings/dotnet/tests/run-style-publication-tests.sh "$(command -v dotnet)" "$PWD/artifacts/native/linux-x64/lib/libaether_core.so"
  dom-commit-allocations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Build allocator oracle with opt-in diagnostic counters
        run: |
          cmake -S native -B artifacts/build/dom-allocations -DCMAKE_BUILD_TYPE=Release -DAETHERUI_BUILD_TESTS=ON -DAETHERUI_ENABLE_WORK_COUNTERS=ON -DAETHERUI_ENABLE_STATE_INCREMENTAL=OFF -DCMAKE_INSTALL_PREFIX="$PWD/artifacts/native/linux-x64"
          cmake --build artifacts/build/dom-allocations --target aether_core aether_dom_commit_allocations_test aether_dom_edit_allocations_test aether_transition_allocations_test --parallel 2
          cmake --install artifacts/build/dom-allocations
      - name: Require measured native allocation gate, never a skipped zero
        run: |
          ctest --test-dir artifacts/build/dom-allocations -R '^aether\.(dom-commit-allocations|dom-edit-allocations|transition-allocations)$' --no-tests=error --output-on-failure --output-junit dom-allocation-results.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('artifacts/build/dom-allocations/dom-allocation-results.xml').getroot()
          cases = root.findall('.//testcase')
          assert len(cases) == 3 and not root.findall('.//skipped') and not root.findall('.//failure') and not root.findall('.//error'), 'Allocation gate unavailable, missing or failed'
          PY
      - name: Measure real managed DOM publication intervals
        run: bindings/dotnet/tests/run-dom-commit-allocation-tests.sh "$(command -v dotnet)" "$PWD/artifacts/native/linux-x64/lib/libaether_core.so"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dom-commit-allocation-linkage
          path: |
            artifacts/build/dom-allocations/dom-commit-allocation-manifest-*.txt*
            artifacts/build/dom-allocations/dom-edit-allocation-manifest-*.txt*
            artifacts/build/dom-allocations/transition-allocation-manifest-*.txt*
            artifacts/build/dom-allocations/dom-allocation-results.xml
