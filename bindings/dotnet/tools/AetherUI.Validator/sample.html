<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 32px;
    background-color: #0f172a;
    color: white;
    font-family: "Segoe UI";
  }

  .card {
    width: 320px;
    padding: 24px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    background-color: rgba(255, 255, 255, 0.06);
  }

  h1 {
    margin: 0 0 8px 0;
    font-size: 22px;
  }

  p {
    color: #94a3b8;
  }

  .row {
    display: flex;
    flex-direction: row;
    gap: 12px;
    margin-top: 16px;
  }

  .pill {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 8px;
    background-color: #2563eb;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Validator sandbox</h1>
    <p>Edit this file and save — both panes reload automatically.</p>
    <div class="row">
      <div class="pill">One</div>
      <div class="pill">Two</div>
      <div class="pill">Three</div>
    </div>
  </div>
</body>
</html>
